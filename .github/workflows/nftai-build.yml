name: NFTAI Windows and macOS builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            label: Windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            label: macOS-Apple-Silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            label: macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vitest run src/nftai
      - run: node --test portal-integration/apply.test.cjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib nftai -- --test-threads=1
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: Build installer (unsigned preview)
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
        env:
          RUSTUP_TOOLCHAIN: stable
      - uses: actions/upload-artifact@v4
        with:
          name: NFTAI-Toolbox-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
